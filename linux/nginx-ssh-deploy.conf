# ssh-deploy nginx 反代 + Bearer token 鉴权
# 用法:
#   1) 把本文件 include 到 /etc/nginx/nginx.conf 的 http {} 块里
#   2) 或拷到 /etc/nginx/conf.d/ssh-deploy.conf
#   3) systemctl reload nginx

# 在 http {} 块顶部或 env 文件设:
#   env BEARER_TOKEN=<你的token>;

map $http_authorization $ssh_deploy_auth_ok {
    default                           0;
    "Bearer YOUR_TOKEN_HERE"          1;
}

server {
    listen 8080;
    server_name _;

    # 长轮询 timeout: server.py 长轮询 wait=30s, hold 上限 35s
    proxy_read_timeout  40s;
    proxy_send_timeout  40s;

    # 健康检查不鉴权
    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
    }

    # /status (admin only, app 层校验)
    location = /status {
        proxy_pass http://127.0.0.1:8081;
    }

    # 设备目录 API 全部要求 Bearer token
    location ^~ /device/ {
        if ($ssh_deploy_auth_ok = 0) { return 403; }

        location = /device/list {
            proxy_pass http://127.0.0.1:8081;
        }
        location = /device/changes {
            proxy_pass http://127.0.0.1:8081;
        }
        location = /device/register {
            proxy_pass http://127.0.0.1:8081;
        }
        location = /device/heartbeat {
            proxy_pass http://127.0.0.1:8081;
        }
        location = /device/deregister {
            proxy_pass http://127.0.0.1:8081;
        }

        # 兜底
        location /device/ {
            proxy_pass http://127.0.0.1:8081;
        }
    }

    # 共享 folder API
    location ^~ /shared/ {
        if ($ssh_deploy_auth_ok = 0) { return 403; }

        location = /shared/list {
            proxy_pass http://127.0.0.1:8081;
        }
        location = /shared/create {
            proxy_pass http://127.0.0.1:8081;
        }
        location = /shared/join {
            proxy_pass http://127.0.0.1:8081;
        }
        location = /shared/leave {
            proxy_pass http://127.0.0.1:8081;
        }

        location /shared/ {
            proxy_pass http://127.0.0.1:8081;
        }
    }

    # 其他全 404
    location / {
        return 404;
    }
}