# ssh-deploy nginx 反代 + Bearer token 鉴权
# 用法:
#   1) 把本文件 include 到 /etc/nginx/nginx.conf 的 http {} 块里
#   2) 或拷到 /etc/nginx/conf.d/ssh-deploy.conf
#   3) systemctl reload nginx

# 在 http {} 块顶部或 env 文件设:
#   env BEARER_TOKEN=<你的token>;

map $http_authorization $ssh_deploy_auth_ok {
    default                           0;
    "Bearer YOUR_TOKEN_HERE"          1;
}

server {
    listen 8080;
    server_name _;

    # 健康检查不鉴权
    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
    }

    # 注册中心全部路径要求 Bearer token
    location ^~ /ssh-deploy/ {
        if ($ssh_deploy_auth_ok = 0) { return 403; }

        # GET 列表
        location = /ssh-deploy/hosts {
            proxy_pass http://127.0.0.1:8081;
        }
        # POST 注册
        location = /ssh-deploy/register {
            if ($request_method != POST) { return 405; }
            proxy_pass http://127.0.0.1:8081;
        }
        # POST 注销
        location = /ssh-deploy/unregister {
            if ($request_method != POST) { return 405; }
            proxy_pass http://127.0.0.1:8081;
        }

        # 兜底
        location /ssh-deploy/ {
            proxy_pass http://127.0.0.1:8081;
        }
    }

    # 其他全 404
    location / {
        return 404;
    }
}